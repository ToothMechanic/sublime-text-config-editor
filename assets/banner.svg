<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1425"/>
      <stop offset="55%" stop-color="#241b34"/>
      <stop offset="100%" stop-color="#2e1f2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#ff7a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="winTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2e4a"/>
      <stop offset="100%" stop-color="#2a2138"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <circle cx="960" cy="120" r="260" fill="url(#glow)"/>

  <!-- faint code grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- editor window mockup -->
  <g>
    <rect x="770" y="60" width="360" height="230" rx="14" fill="#1c1626" stroke="#4a3a5c" stroke-width="1.5"/>
    <rect x="770" y="60" width="360" height="30" rx="14" fill="url(#winTop)"/>
    <circle cx="790" cy="75" r="5" fill="#ff5f56"/>
    <circle cx="808" cy="75" r="5" fill="#ffbd2e"/>
    <circle cx="826" cy="75" r="5" fill="#27c93f"/>

    <!-- code lines -->
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="14">
      <rect x="792" y="105" width="18" height="14" rx="3" fill="#7a5cff" opacity="0.5"/>
      <rect x="816" y="105" width="90" height="14" rx="3" fill="#ffb454" opacity="0.85"/>
      <rect x="912" y="105" width="60" height="14" rx="3" fill="#8fd3ff" opacity="0.6"/>

      <rect x="792" y="132" width="60" height="14" rx="3" fill="#ff7a3d" opacity="0.7"/>
      <rect x="858" y="132" width="120" height="14" rx="3" fill="#e9e2f5" opacity="0.35"/>

      <rect x="792" y="159" width="34" height="14" rx="3" fill="#7a5cff" opacity="0.5"/>
      <rect x="832" y="159" width="150" height="14" rx="3" fill="#8fd3ff" opacity="0.5"/>

      <rect x="792" y="186" width="90" height="14" rx="3" fill="#ffb454" opacity="0.85"/>
      <rect x="888" y="186" width="70" height="14" rx="3" fill="#e9e2f5" opacity="0.35"/>

      <rect x="792" y="213" width="120" height="14" rx="3" fill="#ff7a3d" opacity="0.7"/>
    </g>

    <!-- blinking cursor bar -->
    <rect x="792" y="240" width="3" height="16" fill="#ffb454"/>

    <!-- license key badge -->
    <rect x="912" y="234" width="180" height="34" rx="8" fill="#2f2440" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="1002" y="257" fill="#ffd9a8" font-size="14" font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle" letter-spacing="2">LICENSE OK</text>
  </g>

  <!-- download arrow motif -->
  <g transform="translate(700,150)">
    <path d="M0,-40 L0,40" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M-30,15 L0,50 L30,15" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- decorative speed/orbit rings behind text -->
  <g stroke="#ffb454" stroke-opacity="0.15" fill="none">
    <circle cx="180" cy="300" r="90"/>
    <circle cx="180" cy="300" r="140"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="58" fill="#f5efff">
    <tspan x="60" dy="0" textLength="1030" lengthAdjust="spacingAndGlyphs">Sublime Text Full Version</tspan>
    <tspan x="60" dy="68" textLength="480" lengthAdjust="spacingAndGlyphs" fill="url(#gold)">Download</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#cfc3e0">
    <tspan x="60" dy="0" textLength="700" lengthAdjust="spacingAndGlyphs">Downloads Sublime Text full version, installs license,</tspan>
    <tspan x="60" dy="30" textLength="640" lengthAdjust="spacingAndGlyphs">exports ready-to-use editor — no setup</tspan>
  </text>
</svg>